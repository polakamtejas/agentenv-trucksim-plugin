     run, drawn where it happened. The ground is USGS aerial imagery, the cities OpenStreetMap's buildings (OpenFreeMap's
     tiles), the trucks Kenney's models at the run's own positions, and every number on screen is read from the runs.
     ?record=1 is the renderer's mode (scripts/render_cinema.py trailer): window.cinema.seek(t) draws the frame at t
     seconds and resolves once the map's tiles are in. Otherwise it plays; click pauses, the arrow keys step 2 s. -->

<div id="map"></div>
<div class="layer" id="grade"></div>
<div class="band" id="dof-top"></div><div class="band" id="dof-bot"></div>
<div class="layer" id="shade"></div>

<script src="vendor/deck.gl-9.4.0.min.js"></script>
<script type="importmap">{ "imports": { "@deck.gl/core": "./vendor/deck.gl-core-shim.mjs" } }</script>
<script type="module">
import * as maplibregl from "./vendor/maplibre-gl-6.14.0/maplibre-gl.mjs";
import { MapLibreOverlay } from "./vendor/deck.gl-maplibre-9.4.0/index.js";
import { D2R, clamp, lerp, smooth, esc, money, plural, metersBetween, bearingOf, step, getJSON, SEAT_RGB, runModel } from "./runmodel.mjs";

const D = window.deck;
const Q = new URLSearchParams(location.search);
const RECORD = Q.has("record");
const fail = e => { const el = document.getElementById("err"); el.style.display = "flex"; el.textContent = "The trailer could not start:\n" + (e && e.stack || e); window.cinema = { error: String(e && e.stack || e) }; };
window.addEventListener("error", ev => fail(ev.error || ev.message));
window.addEventListener("unhandledrejection", ev => fail(ev.reason));
const $ = id => document.getElementById(id);

// ---- the runs it is cut from ---------------------------------------------------------------------------------------
const SITE = await getJSON("site.json");
const SHAPES = await getJSON("road_shapes.json");
const OPUS = "anthropic/claude-opus-5-5";
function runOn(monday, model) {
  const r = (SITE.runs || []).find(r => r.monday === monday && r.model === model);
  if (!r) throw new Error(`site.json has no run of the week of ${monday} by ${model}: the trailer is cut from the board-v11 site`);
  return r;
}
const best = (SITE.runs || []).filter(r => r.model === OPUS && r.reward != null).sort((x, y) => y.reward - x.reward || (x.task < y.task ? -1 : 1))[0];
if (!best) throw new Error(`site.json has no scored run by ${OPUS}`);
// O: Hurricane Delta's week (the title, the board, Delta, the close); U: Winter Storm Uri's; J: Opus's best week by score
// (its desk, a breakdown, its books).
const PICK = { O: runOn("2020-10-05", OPUS), J: best, U: runOn("2021-02-15", OPUS) };
const RAW = {}, RUN = {};
for (const [k, s] of Object.entries(PICK)) {
  RAW[k] = await getJSON(`runs/${encodeURIComponent(s.id)}.json`);
  RUN[k] = runModel(RAW[k], SHAPES, { id: s.id, model: s.model, lane: S => 0.9 * S });
}
const O = RUN.O, J = RUN.J, U = RUN.U;

// ---- small helpers -------------------------------------------------------------------------------------------------
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const dayOf = (M, tick) => { const d = new Date(M.MONDAY.getTime() + Math.floor(tick / 96) * 86400000); return { wd: WD[Math.floor(tick / 96) % 7], d: d.getUTCDate(), m: MON[d.getUTCMonth()], y: d.getUTCFullYear() }; };
const dateLine = (M, tick) => { const x = dayOf(M, tick); return `${x.wd} ${x.d} ${x.m} ${x.y}`; };
const weekLine = M => { const a = dayOf(M, 0), b = dayOf(M, 6 * 96); return a.m === b.m ? `${a.d}–${b.d} ${a.m} ${a.y}` : `${a.d} ${a.m}–${b.d} ${b.m} ${b.y}`; };
const hhmm = tick => { const m = Math.floor((((tick % 96) + 96) % 96) * 15); return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const road = r => r.replace(/^I (\d+)/, "I-$1").replace(/^US (\d+)/, "US-$1").replace(/^TX (\d+)/, "TX-$1");
const prettyModel = m => m.replace(/^anthropic\//, "").replace(/^claude-([a-z]+)-(\d+)-(\d+)$/, (_, n, a, b) => `Claude ${n[0].toUpperCase() + n.slice(1)} ${a}.${b}`);
const shortModel = m => prettyModel(m).replace(/^Claude /, "");
const cityName = (M, id) => M.CITY[id].name;
const UNIT_TEXT = { semi: "tractor + 53' dry van", reefer: "tractor + 53' reefer", box: "26' box truck", van: "cargo van" };
const FRONT = { semi: 4.3, reefer: 4.3, box: 2.4, van: 1.5 }, BACK = { semi: -4.25, reefer: -4.25, box: -2.4, van: -1.5 };   // model units
// Where the camera looks in each city: its downtown (art direction; the sim's city points are Census centroids).
const DOWNTOWN = { HOU: [-95.3665, 29.7590], AUS: [-97.7431, 30.2690], DAL: [-96.7990, 32.7800], SA: [-98.4900, 29.4250] };
// A semi is 8.5 model units long: at this many meters a unit, the close shots draw it about 3 times life size.
const S_CLOSE = 7.5;
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
function weekScore(model, kind) {   // a model's mean score over the site's weeks of one kind
  const xs = SITE.runs.filter(r => r.model === model && r.kind === kind && r.reward != null).map(r => r.reward);
  if (!xs.length) throw new Error(`site.json has no ${kind} weeks by ${model}`);
  return { v: mean(xs), n: xs.length };
}
const roadBearing = (M, L) => M.along(L.a, L.b, L.mile).brg;   // which way the road runs under a truck that stands still

function findTick(M, tid, lo, hi, test, what) {   // the first 15 s of sim time in [lo, hi] at which test(L, w) holds
  for (let t = lo; t <= hi; t += 1 / 60) { const L = M.logical(tid, t); if (test(L, M.world(tid, t, S_CLOSE), t)) return t; }
  throw new Error(`no moment for ${what}: ${tid} never matches between ticks ${lo} and ${hi}`);
}
// The first moment (15 s of sim time apart) in the windows of ticks [lo, hi] at which test(tid, L, t) holds for a truck
// on the road, or null; trucks are tried in id order, so the same run always gives the same moment.
function firstMoment(M, windows, test) {
  const ids = Object.keys(M.TRUCK).sort();
  for (const [lo, hi] of windows) for (let t = lo; t <= hi; t += 1 / 60) for (const tid of ids) {
    const L = M.logical(tid, t);
    if (!L.city && test(tid, L, t)) return { tid, t };
  }
  return null;
}
const daily = (h0, h1) => [0, 1, 2, 3, 4, 5, 6].map(d => [d * 96 + h0 * 4, d * 96 + h1 * 4]);
const moving = (M, tid, t) => speedAt(M, tid, t) > 1500;                    // m a tick: more than about 4 mph
const need = (x, what) => { if (!x) throw new Error(`no moment for ${what} in this run`); return x; };
function heading(M, tid, tick, S) {   // the way a truck drives, smoothed over a few hundred meters of road
  let ex = 0, ny = 0;
  for (let k = -4; k <= 4; k++) {
    const a = M.world(tid, tick + k * 0.01 - 0.006, S).p, b = M.world(tid, tick + k * 0.01 + 0.006, S).p;
    ex += (b[0] - a[0]) * Math.cos(a[1] * D2R); ny += b[1] - a[1];
  }
  return Math.hypot(ex, ny) < 1e-9 ? null : (Math.atan2(ex, ny) / D2R + 360) % 360;
}
const speedAt = (M, tid, tick) => metersBetween(M.world(tid, tick - 0.02, S_CLOSE).p, M.world(tid, tick + 0.02, S_CLOSE).p) / 0.04;   // m a tick
// A chase camera: it looks `lead` meters ahead of the truck, from behind it turned `yaw` degrees.
function chase(M, tid, tick, { yaw, lead, zoom, pitch }) {
  const w = M.world(tid, tick, S_CLOSE), h = heading(M, tid, tick, S_CLOSE) ?? w.brg;
  return { center: step(w.p, h, lead), zoom, pitch, bearing: h + yaw };
}
const view = (center, zoom, pitch, bearing) => ({ center, zoom, pitch, bearing });
// A stretch of road under one of the week's weather events at tick, if the truck's mile is inside it.
function weatherOn(M, L, tick, re) {
  if (L.city) return null;
  const miles = M.edgeOf(L.a, L.b).miles;
  return M.weatherAt(tick).find(d => re.test(d.iv.type) && d.fade > 0.9 &&
    ((d.w.a === L.a && d.w.b === L.b && L.mile >= d.w.m0 && L.mile <= d.w.m1) || (d.w.a === L.b && d.w.b === L.a && miles - L.mile >= d.w.m0 && miles - L.mile <= d.w.m1))) || null;
}
const MARK = `<svg viewBox="0 0 32 32"><rect x="2" y="2" width="12" height="12" rx="3" fill="#e8e7fc"/><rect x="18" y="2" width="12" height="12" rx="3" fill="#9e8cfc"/><rect x="2" y="18" width="12" height="12" rx="3" fill="#e8e7fc"/></svg>`;
const CREDITS = `<div class="credits a" data-d="0.35"><span class="k">BUILT USING</span><span class="v">${MARK}AgentEnv Framework</span><span class="k">BY</span><span class="v">Scale AI</span></div>`;
const TITLE = `<div class="eyebrow a">An RL environment · real Texas freight data</div><div class="title a" data-d="0.1">TruckSim<i>Env</i></div><div class="sub a" data-d="0.2">A Texas trucking company's dispatch desk, for AI agents.</div>`;

// ---- the chapters --------------------------------------------------------------------------------------------------
// Each: a run, a look, the run's clock (tick at u seconds into the chapter), a camera, and its type. A tick is the sim's
// 15 minutes from Monday 00:00 of the run's week. `cont` chapters carry on the shot before them, with no dip to black.
const CH = [];

{ // 1. the title: a loaded truck pulls into a downtown at golden hour (Dallas first)
  let m = null, city = null;
  for (const c of ["DAL", "HOU", "AUS", "SA"]) {
    m = firstMoment(O, daily(17, 20), (tid, L, t) => L.state === "loaded" && moving(O, tid, t) && !weatherOn(O, L, t, /./) && metersBetween(O.world(tid, t, S_CLOSE).p, DOWNTOWN[c]) < 2600);
    if (m) { city = c; break; }
  }
  const { tid, t: t0 } = need(m, "the title"), rate = 30 / speedAt(O, tid, t0), dur = 7;
  CH.push({ id: "title", dur, run: O, look: "golden", tick: u => t0 + rate * u,
    cam: (u, tk) => {   // over the truck's shoulder, toward the skyline
      const e = smooth(u / dur), p = O.world(tid, tk, S_CLOSE).p, b = bearingOf(p, DOWNTOWN[city]);
      return view(step(p, b, lerp(420, 620, e)), lerp(15.75, 15.4, e), lerp(72, 76, e), b + lerp(-14, 2, e));
    },
    type: () => ({ html: `<div class="blk low">${TITLE}</div>${CREDITS}` }) });
}
{ // 2. the board: three companies through a day
  const R = RAW.O, nC = Object.keys(O.CITY).length, nR = O.ROADS.length, posted = R.events.filter(e => e.kind === "offer_posted").length;
  const per = O.SEATS.map(s => R.trucks.filter(t => t.seat === s).length), drv = O.SEATS.map(s => (R.drivers || []).filter(d => d.seat === s && d.kind !== "temp").length);
  if (!per.every(x => x === per[0]) || !drv.every(x => x === drv[0])) throw new Error("the board chapter says every company has the same fleet, and this run's don't");
  const hubs = O.SEATS.map(s => cityName(O, R.seats[s].hub)), t0 = 96 + 16 * 4, dur = 6.5, rate = 96 / dur;   // Tue 16:00 to Wed 16:00, the busy middle of the week
  CH.push({ id: "board", dur, run: O, look: "board", board: true, dof: false, tick: u => t0 + rate * u,
    cam: u => { const e = smooth(u / dur); return view([lerp(-96.4, -96.25, e), lerp(30.05, 30.3, e)], lerp(6.45, 6.75, e), lerp(38, 47, e), lerp(-15, -6, e)); },
    type: tk => ({ html: `<div class="blk low"><div class="eyebrow a">The Texas Triangle · ${nC} cities · ${nR} roads</div><div class="head a" data-d="0.1">Three companies.\nOne load board.</div>
      <div class="sub a" data-d="0.2">Each runs ${per[0]} trucks and ${drv[0]} drivers out of ${hubs.slice(0, -1).join(", ")} or ${hubs[hubs.length - 1]}, bidding for the same ${posted} loads, in a real week.</div></div>`,
      ticker: `Week of ${weekLine(O)} · ${dateLine(O, tk)} · ${hhmm(tk)}` }) });
}
{ // 3. real freight: a loaded truck heads into a city by day, on a dry road (Austin first)
  let m = null;
  for (const c of ["AUS", "DAL", "SA", "HOU"]) {
    m = firstMoment(J, daily(9, 16), (tid, L, t) => L.state === "loaded" && moving(J, tid, t) && !weatherOn(J, L, t, /./) && metersBetween(J.world(tid, t, S_CLOSE).p, DOWNTOWN[c]) < 12500);
    if (m) break;
  }
  const { tid, t: t0 } = need(m, "the freight shot"), L0 = J.logical(tid, t0), rate = 30 / speedAt(J, tid, t0), dur = 6, unit = UNIT_TEXT[J.modelOf(J.TRUCK[tid])];
  CH.push({ id: "freight", dur, run: J, look: "winter", tick: u => t0 + rate * u,
    cam: (u, tk) => { const e = smooth(u / dur); return chase(J, tid, tk, { yaw: lerp(42, 18, e), lead: lerp(40, 160, e), zoom: lerp(16.7, 16.35, e), pitch: lerp(64, 70, e) }); },
    type: tk => ({ html: `<div class="blk low"><div class="eyebrow a">FAF5 freight · OpenStreetMap roads · EIA diesel</div><div class="head a" data-d="0.1">Real freight. Real roads.</div>
      <div class="sub a" data-d="0.2">Loads follow the federal Freight Analysis Framework's flows. Routes come from OpenStreetMap, diesel at the price EIA posted that week.</div></div>`,
      ticker: `${tid} · ${unit} · ${J.logical(tid, tk).state} · ${road(J.edgeOf(L0.a, L0.b).route)} → ${cityName(J, L0.b)} · ${dateLine(J, tk)} · ${hhmm(tk)}` }) });
}
{ // 4. Hurricane Delta: a truck under one of NOAA's tropical-storm reports for its county
  const re = /Tropical|Hurricane/, { tid, t: t0 } = need(firstMoment(O, [[3 * 96, 6 * 96]], (tid, L, t) => moving(O, tid, t) && weatherOn(O, L, t, re)), "the Delta shot");
  const L0 = O.logical(tid, t0), wx = weatherOn(O, L0, t0, re), nWx = RAW.O.events.filter(e => e.kind === "weather_start").length;
  const rate = 20 / speedAt(O, tid, t0), dur = 6, pct = Math.round(100 * wx.iv.f);
  CH.push({ id: "delta", dur, run: O, look: "storm", fx: "rain", lightning: [1.35, 1.47, 4.15, 4.27, 4.4], tick: u => t0 + rate * u,
    cam: (u, tk) => { const e = smooth(u / dur); return chase(O, tid, tk, { yaw: lerp(64, 38, e), lead: lerp(20, 120, e), zoom: lerp(16.45, 16.2, e), pitch: lerp(62, 68, e) }); },

        getPosition: d => d.p, getRadius: 6, radiusUnits: "pixels", getFillColor: d => seatLine(d.seat), stroked: true, getLineColor: [255, 255, 255, 230], lineWidthUnits: "pixels", getLineWidth: 1.5, updateTriggers: { getPosition: tick } }),
      new D.ScatterplotLayer({ id: "cities", data: Object.values(M.CITY), getPosition: d => d.p, getRadius: d => d.freight ? 4 : 2.6, radiusUnits: "pixels", getFillColor: d => d.freight ? [240, 244, 250] : [170, 182, 198], stroked: true, getLineColor: [8, 10, 14], lineWidthUnits: "pixels", getLineWidth: 1.2 }),
      new D.TextLayer({ id: "city-names", data: Object.values(M.CITY).filter(c => c.freight && !hubs.some(h => h.city === c.id)), getPosition: d => d.p, getText: d => d.name, getSize: 15, getColor: [226, 232, 242, 230], getPixelOffset: [0, -16], fontFamily: FONT, fontWeight: 600, fontSettings: { sdf: true }, outlineWidth: 4, outlineColor: [6, 8, 12, 230], characterSet: "auto" }),
      new D.TextLayer({ id: "hub-names", data: hubs, getPosition: d => M.CITY[d.city].p, getText: d => `${M.CITY[d.city].name.toUpperCase()} · ${d.seat}`, getSize: 19, getColor: d => seatLine(d.seat), getPixelOffset: [0, -20], fontFamily: FONT, fontWeight: 800, fontSettings: { sdf: true }, outlineWidth: 5, outlineColor: [6, 8, 12, 240], characterSet: "auto" }),
    );
    for (const key of MODEL_KEYS) out.push(new D.ScenegraphLayer({ id: "trucks-" + key, data: [], scenegraph: `models/${key}.glb`, sizeScale: 1, _lighting: "pbr" }));
    return out;
  }
  const S = S_CLOSE, P = poses(M, tick, S), moving = P.filter(d => d.L.state !== "broken" && d.L.state !== "held" && d.L.state !== "resting");
  if (ch.closures) {
    const shut = M.closuresAt(tick);
    const closed = shut.map(c => ({ c, path: M.stretch(c.a, c.b, c.m0, c.m1) }));   // the closed miles only, from the barriers on
    out.push(new D.PathLayer({ id: "closure-glow", data: closed, getPath: d => d.path, getColor: [255, 60, 50, 70], getWidth: 14, widthUnits: "pixels", capRounded: true }),
             new D.PathLayer({ id: "closures", data: closed, getPath: d => d.path, getColor: [255, 80, 66, 210], getWidth: 3.5, widthUnits: "pixels", capRounded: true }),
             new D.ColumnLayer({ id: "barriers", data: shut.flatMap(c => c.ends.flatMap(e => [-1.5, -0.5, 0.5, 1.5].map(k => step(e.p, e.brg + 90, k * 1.4 * S)))), getPosition: d => d,
               radius: 0.5 * S, diskResolution: 4, getElevation: 1.4 * S, getFillColor: [235, 44, 36, 255], extruded: true }));
  }
  if (L.lights) {
    const f = d => FRONT[d.model] * S, b = d => BACK[d.model] * S;
    out.push(new D.ScatterplotLayer({ id: "beams", data: moving, getPosition: d => step(d.p, d.brg, f(d) + 5 * S), getRadius: 5 * S, radiusUnits: "meters", getFillColor: [255, 226, 160, 55], updateTriggers: { getPosition: tick } }),
             new D.ScatterplotLayer({ id: "headlights", data: moving.flatMap(d => [-0.5, 0.5].map(k => step(step(d.p, d.brg, f(d)), d.brg + 90, k * S))), getPosition: d => d, getRadius: 3.2, radiusUnits: "pixels", getFillColor: [255, 248, 222, 250], updateTriggers: { getPosition: tick } }),
             new D.ScatterplotLayer({ id: "taillights", data: P.flatMap(d => [-0.5, 0.5].map(k => step(step(d.p, d.brg, b(d)), d.brg + 90, k * S))), getPosition: d => d, getRadius: 2.4, radiusUnits: "pixels", getFillColor: [255, 40, 30, 230], updateTriggers: { getPosition: tick } }));
  }
  const broken = P.filter(d => d.L.state === "broken"), blink = (T * 1.6) % 1 < 0.5, pulse = 0.5 + 0.5 * Math.sin(T * 4);
  if (broken.length) out.push(
    new D.ScatterplotLayer({ id: "ring", data: broken, getPosition: d => d.p, getRadius: (7 + 2 * pulse) * S, radiusUnits: "meters", stroked: true, filled: true, getFillColor: [255, 80, 70, 40], getLineColor: [255, 80, 70, 220], lineWidthUnits: "pixels", getLineWidth: 2.5, updateTriggers: { getRadius: T } }),
    new D.ScatterplotLayer({ id: "hazards", data: blink ? broken.flatMap(d => [FRONT[d.model], BACK[d.model]].flatMap(z => [-0.55, 0.55].map(k => step(step(d.p, d.brg, z * S), d.brg + 90, k * S)))) : [], getPosition: d => d, getRadius: 5, radiusUnits: "pixels", getFillColor: [255, 176, 40, 255], updateTriggers: { getPosition: T } }));
  for (const key of MODEL_KEYS) {
    const [m, s] = key.split("-");
    out.push(new D.ScenegraphLayer({ id: "trucks-" + key, data: P.filter(d => d.t.seat === s && d.model === m), scenegraph: `models/${key}.glb`, getPosition: d => [d.p[0], d.p[1], 0], getOrientation: d => [0, 180 - d.brg, 90],
      getColor: [...L.tint, 255], sizeScale: S, _lighting: "pbr", updateTriggers: { getPosition: tick, getOrientation: tick, getColor: ch.look } }));
  }
  return out;
}

// ---- weather in screen space: snow and rain fall as a function of T, so the same frame always draws the same --------
const fx = $("fx").getContext("2d");
function mulberry32(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20210215);
const FLAKES = [...Array(950).keys()].map(() => ({ x: rnd(), y: rnd(), z: 0.2 + 0.8 * rnd(), ph: 6.3 * rnd() }));
const DROPS = [...Array(1200).keys()].map(() => ({ x: rnd(), y: rnd(), z: 0.2 + 0.8 * rnd() }));
function weatherFx(kind, T, alpha) {
  const W = 1920, H = 1080;
  fx.clearRect(0, 0, W, H);
  if (!kind || alpha <= 0) return;
  if (kind === "snow") {
    fx.fillStyle = "#fff";
    for (const f of FLAKES) {
      const y = ((f.y * (H + 40) + T * (55 + 150 * f.z)) % (H + 40)) - 20, x = (((f.x * W + T * 30 * f.z + 22 * f.z * Math.sin(T * 0.9 + f.ph)) % W) + W) % W;
      fx.globalAlpha = alpha * (0.3 + 0.62 * f.z); fx.beginPath(); fx.arc(x, y, 0.7 + 2.8 * f.z ** 1.6, 0, 6.283); fx.fill();
    }
  } else if (kind === "rain") {
    fx.strokeStyle = "#c9d6e2"; fx.lineCap = "round";
    for (const d of DROPS) {
      const len = 16 + 46 * d.z, y = ((d.y * (H + 80) + T * (1300 + 1100 * d.z)) % (H + 80)) - 40, x = (((d.x * W - y * 0.22) % W) + W) % W;
      fx.globalAlpha = alpha * (0.1 + 0.3 * d.z); fx.lineWidth = 0.6 + 1.3 * d.z; fx.beginPath(); fx.moveTo(x, y); fx.lineTo(x - len * 0.22, y + len); fx.stroke();
    }
  }
  fx.globalAlpha = 1;
}

// ---- type ----------------------------------------------------------------------------------------------------------
const stageScale = () => { const s = innerWidth / 1920; $("stage").style.transform = `scale(${s})`; };
addEventListener("resize", stageScale); stageScale();
let typeKey = "";
function type(ch, u, tick) {
  const t = ch.type(tick, u), key = ch.id + "|" + t.html;
  if (key !== typeKey) { typeKey = key; $("stage").innerHTML = t.html + (t.ticker ? `<div class="ticker a" data-d="0.5">${esc(t.ticker)}</div>` : ""); }
  const out = 1 - smooth((u - (ch.dur - 0.55)) / 0.42);
  for (const el of $("stage").querySelectorAll(".a")) {
    const d = Number(el.dataset.d || 0), k = smooth((u - 0.25 - d) / 0.6);
    el.style.opacity = (k * out).toFixed(3); el.style.transform = `translateY(${((1 - k) * 18).toFixed(1)}px)`;
  }
  const low = /blk low/.test(t.html), top = /blk top/.test(t.html);
  $("shade").style.background = [low || top ? "linear-gradient(0deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.22) 34%, rgba(0,0,0,0) 56%)" : "",
    top ? "linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 34%)" : "", "radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%)"].filter(Boolean).join(", ");
}
function pills(ch, tick) {   // a label over the closed road, just inside the end where the shot's trucks wait
  const box = $("labels"), pl = ch.pill, c = pl && ch.run.closuresAt(tick).find(c => c.closure_id === pl.closure);
  if (!c) { box.innerHTML = ""; return; }
  const xy = map.project(ch.run.along(c.a, c.b, pl.mile).p);
  box.innerHTML = xy.x > 0 && xy.x < innerWidth && xy.y > 0 && xy.y < innerHeight
    ? `<div class="pill" style="left:${xy.x}px;top:${xy.y - 40}px">${esc(pl.text.toUpperCase())}</div>` : "";
}

// ---- drawing a moment ----------------------------------------------------------------------------------------------
let lastFrame = null;
function draw(T) {
  T = clamp(T, 0, DURATION - 1e-6);
  const i = chapterAt(T), ch = CH[i], u = T - ch.t0, tick = ch.tick(u);
  setLook(ch.look);
  map.jumpTo(ch.cam(u, tick));
  overlay.setProps({ layers: layers(ch, T, u, tick) });
  const dof = ch.dof !== false; $("dof-top").style.display = $("dof-bot").style.display = dof ? "" : "none";
  weatherFx(ch.fx, T, 1);
  const fl = (ch.lightning || []).reduce((a, s) => Math.max(a, Math.exp(-(((u - s) / 0.045) ** 2))), 0);
  $("flash").style.opacity = (0.55 * fl).toFixed(3);
  type(ch, u, tick);
  pills(ch, tick);
  const next = CH[i + 1], first = i === 0, last = i === CH.length - 1;
  const fin = ch.cont ? 0 : 1 - smooth(u / (first ? 0.9 : 0.32)), fout = next && next.cont ? 0 : smooth((u - (ch.dur - (last ? 1.0 : 0.26))) / (last ? 1.0 : 0.26));
  $("black").style.opacity = Math.max(fin, fout).toFixed(3);
  lastFrame = { T, chapter: ch.id, tick };
}
const idle = () => new Promise(res => { map.once("idle", res); map.triggerRepaint(); });
async function modelsLoaded() {   // the GLBs load asynchronously: a recording must not start before they draw
  const t0 = performance.now();
  for (;;) {
    const ls = (overlay._deck && overlay._deck.layerManager) ? overlay._deck.layerManager.getLayers() : [];
    const scene = ls.filter(l => l.id.startsWith("trucks-"));
    if (scene.length === MODEL_KEYS.length && scene.every(l => l.state && l.state.scenegraph)) return;
    if (performance.now() - t0 > 30000) throw new Error("the truck models did not load in 30 s");
    draw(Number(Q.get("t") || 0.5)); await new Promise(r => setTimeout(r, 100));
  }
}
draw(Number(Q.get("t") || 0.5));
await modelsLoaded();
await document.fonts.ready;
await idle();
window.cinema = { duration: DURATION, ready: true, segments: CH.map(c => ({ kind: c.id, t0: c.t0, t1: c.t0 + c.dur })),
                  async seek(T) { draw(T); await idle(); return lastFrame; }, _map: map, _overlay: overlay };   // the last two for debugging

if (!RECORD) {   // play it
  let T = Number(Q.get("t") || 0), playing = !Q.has("paused"), last = performance.now();
  $("clock").hidden = false;
  addEventListener("click", () => { playing = !playing; });
  addEventListener("keydown", e => { if (e.code === "Space") playing = !playing; if (e.code === "ArrowRight") T += 2; if (e.code === "ArrowLeft") T = Math.max(0, T - 2); });
  const loop = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) T = T + dt >= DURATION ? 0 : T + dt;
    draw(T); $("clock").textContent = `${T.toFixed(1)} / ${DURATION.toFixed(1)} s · ${CH[chapterAt(T)].id}${playing ? "" : " · paused"}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
