<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruckSim runs</title>
<style>
/* The look follows PortSimEnv on AgentEnv's replay viewer (earakely-scale/agentenv-portsim-plugin): warm grays, hairline
   rules, a dark stage with glass controls. Seats take the dataviz palette's categorical slots 1-3 (validated all-pairs,
   light and dark); a truck's state is its shape and an icon on the map, and its own fill in the fleet chart. */
:root {
  --bg: #fbfaf8; --fg: #1e1e1e; --muted: #6c6a66; --faint: #a29f99; --line: #e4e1db; --line2: #efede8; --hover: #f3f1ec;
  --sel: #ebe7de; --red: #b8322a; --ok: #3d8a5c; --warn: #c58a1d; --now: #e8602c; --band: #f4f2ee; --gridc: #e9e6e0;
  --seat-A: #2a78d6; --seat-B: #eb6834; --seat-C: #1baf7a;
  --st-rest: #c9c6bf; --st-stop: #e2dfd8; --st-det: #e0ab4a; --st-broken: #d1281c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg: #141414; --fg: #e6e4e0; --muted: #9b9892; --faint: #6d6a65; --line: #2c2b29; --line2: #232220; --hover: #1f1e1c;
    --sel: #2a2825; --red: #e0675d; --ok: #6cbf8a; --warn: #e0ab4a; --now: #f07440; --band: #1b1a19; --gridc: #262523;
    --seat-A: #3987e5; --seat-B: #d95926; --seat-C: #199e70; --st-rest: #3a3936; --st-stop: #2c2b29; --st-det: #b8892f; --st-broken: #ff5a4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --fg: #e6e4e0; --muted: #9b9892; --faint: #6d6a65; --line: #2c2b29; --line2: #232220; --hover: #1f1e1c;
  --sel: #2a2825; --red: #e0675d; --ok: #6cbf8a; --warn: #e0ab4a; --now: #f07440; --band: #1b1a19; --gridc: #262523;
  --seat-A: #3987e5; --seat-B: #d95926; --seat-C: #199e70; --st-rest: #3a3936; --st-stop: #2c2b29; --st-det: #b8892f; --st-broken: #ff5a4c;
  color-scheme: dark;
}
* { box-sizing: border-box; } [hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; } a:hover { text-decoration-color: currentColor; }
h1, h2 { margin: 0; font-weight: 600; } h1 { font-size: 15px; } h2 { font-size: 13px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
header.top { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
header.top .brand { font-weight: 600; text-decoration: none; } header.top .sub { font-size: 12px; color: var(--muted); }
header.top nav { display: flex; gap: 14px; margin-left: 14px; font-size: 13px; }
header.top nav a { text-decoration: none; color: var(--muted); } header.top nav a.on { color: var(--fg); font-weight: 600; }
.crumbs { margin-left: auto; display: flex; gap: 6px; min-width: 0; overflow: hidden; font-size: 12px; color: var(--muted); } .crumbs .sep { color: var(--faint); }
.themebtn { border: 1px solid var(--line); background: transparent; border-radius: 3px; height: 24px; padding: 0 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.page { padding: 0 0 32px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 10px 16px 9px; border-bottom: 1px solid var(--line); }
.page-head .meta { font-size: 12px; color: var(--muted); }
.page-head .play3d { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
.page-head .play3d:hover { background: var(--sel); }
section { min-width: 0; } .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 6px; }
.kv { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 3px 16px; margin: 0; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; } .kv dt[title] { cursor: help; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.ok { background: var(--ok); } .bad { background: var(--red); }
.btn { height: 26px; padding: 0 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 3px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
table.t th { color: var(--muted); font-weight: 500; border-bottom-color: var(--line); } table.t td.r, table.t th.r { text-align: right; }
table.t tbody tr:hover { background: var(--hover); } table.t tr.click { cursor: pointer; }
/* overview */
.ov-page { max-width: 1180px; padding: 16px; }
.ov-page h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.ov-page p { max-width: 780px; color: var(--muted); margin: 6px 0; font-size: 14px; } .ov-page p b { color: var(--fg); }
.glossary { margin: 10px 0 0; padding-left: 18px; color: var(--muted); } .glossary li { margin: 3px 0; } .glossary b { color: var(--fg); }
.start { margin: 20px 0; padding: 10px 12px; border-left: 3px solid var(--warn); background: var(--hover); }
.ov-page h2 { margin: 22px 0 4px; } .ov-page .note { color: var(--muted); font-size: 12px; margin: 2px 0 8px; max-width: 900px; }
.steps { margin: 6px 0 0; padding-left: 20px; max-width: 820px; color: var(--muted); font-size: 14px; } .steps li { margin: 5px 0; } .steps b, .findings b { color: var(--fg); }
.findings { margin: 6px 0 0; padding-left: 18px; max-width: 860px; font-size: 14px; color: var(--muted); } .findings li { margin: 4px 0; }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 9px; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--fg); }
details.more { margin: 10px 0; } details.more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; } details.more[open] summary { margin-bottom: 6px; }
.links { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin-top: 14px; color: var(--muted); }
/* run page */
.ro-grid { display: grid; grid-template-columns: minmax(360px, 38%) minmax(0, 1fr); gap: 0; align-items: start; }
.ro-left { padding: 10px 16px 0; min-width: 0; } .ro-left > section + section { margin-top: 18px; }
.ro-right { position: sticky; top: 0; min-width: 0; border-left: 1px solid var(--line); }
.watch { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.watch-h { margin: 12px 0 4px; padding: 4px 8px; border-left: 3px solid var(--warn); background: var(--hover); font-size: 12px; font-weight: 600; }
.feed, .msgs { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
.feed li, .msgs li { padding: 3px 6px; border-left: 3px solid var(--line); margin-bottom: 3px; }
.feed li.new { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.feed .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.msgs code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.msgs .res { color: var(--muted); white-space: pre-wrap; word-break: break-word; display: block; }
.msgs li.say { border-left-color: var(--faint); font-style: italic; color: var(--muted); }
.msgs li.notes { border-left-color: var(--warn); }
.empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
.stage { position: relative; height: calc(100vh - 40px - 330px); min-height: 380px; background: #0f1b22; overflow: hidden; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ov { position: absolute; z-index: 5; display: flex; gap: 6px; align-items: center; color: #e4edf1; font-size: 12px; }
.ov-tl { top: 10px; left: 10px; flex-wrap: wrap; } .ov-tr { top: 10px; right: 10px; }
.ovbox, .ovb, .ovs { background: rgba(13, 30, 40, .82); color: #e4edf1; border: 1px solid #c3ddea26; border-radius: 6px; box-shadow: 0 3px 12px #09202c18; height: 30px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.ovbox { display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; white-space: nowrap; }
.ovb { cursor: pointer; padding: 0 10px; display: inline-flex; align-items: center; white-space: nowrap; }
.ovb:hover, .ovb[aria-pressed="true"] { background: rgba(28, 57, 70, .94); border-color: #aac9d34d; } .ovb[aria-pressed="false"] { color: #9fb2b9; }
.ovs { padding: 0 6px; cursor: pointer; } .ovs option { background: #17313d; color: #e4edf1; }
.stepnav { padding: 0; gap: 0; } .stepnav .ovb { border: none; box-shadow: none; background: transparent; padding: 0 9px; font-size: 15px; height: 28px; }
.ovcard { position: absolute; z-index: 5; left: 10px; top: 50px; padding: 10px 12px; background: rgba(13, 30, 40, .86); color: #e4edf1; border: 1px solid #c3ddea26; border-radius: 6px; backdrop-filter: blur(16px); font-size: 12px; width: 250px; }
.nw { white-space: nowrap; }
.ring { display: inline-block; width: 8px; height: 8px; border: 2px dashed; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.ovcard .ttl { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #a5bac5; margin-bottom: 4px; }
.ovcard .big { font-size: 15px; } .ovcard .big b { font-size: 20px; font-weight: 600; } .ovcard .sm { color: #b8c7d3; margin-top: 4px; }
.scrub { position: absolute; z-index: 6; left: 10px; right: 10px; bottom: 10px; height: 42px; color: #e4edf1; display: flex; align-items: center; gap: 8px; padding: 0 9px; background: rgba(13, 30, 40, .85); border: 1px solid #c3ddea26; border-radius: 8px; backdrop-filter: blur(16px); }
.scrub .ovb, .scrub .ovs { height: 28px; border-color: transparent; background: #d6ecf00a; }
.scrub .play { width: 34px; justify-content: center; padding: 0; }
.scrub .range { flex: 1; min-width: 60px; accent-color: var(--now); height: 18px; margin: 0; }
.scrub .clock { display: flex; flex-direction: column; line-height: 1.15; min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
.scrub .clock b { font-weight: 600; font-size: 12.5px; } .scrub .clock span { font-size: 11px; color: #a5bac5; }
.attr { position: absolute; z-index: 4; right: 10px; bottom: 58px; font-size: 10px; color: #d6e3e8; background: #122c3b90; padding: 1px 6px; border-radius: 3px; }
.chart-sec { padding: 10px 16px 6px; border-top: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; } .legend i { width: 12px; height: 9px; display: inline-block; border-radius: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0; } .two > .chart-sec + .chart-sec { border-left: 1px solid var(--line); }
@media (max-width: 1100px) { .ro-grid, .two { grid-template-columns: 1fr; } .ro-right { position: static; border-left: 0; } }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--bg); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.18); border-radius: 4px; padding: 6px 9px; font-size: 12px; max-width: 340px; display: none; }
#tip b { font-weight: 600; }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">TruckSim runs</a><span class="sub">Texas Triangle</span>
  <nav><a href="#/" data-tab="overview">Overview</a><a href="#/runs" data-tab="runs">Explorer</a><a id="repo" href="https://github.com/polakamtejas/agentenv-trucksim-plugin" target="_blank" rel="noopener">Run it yourself ↗</a></nav>
  <div class="crumbs" id="crumbs"></div>
  <button class="themebtn" id="theme" type="button">Theme</button>
</header>
<main id="main"></main>
<div id="tip"></div>
<script id="site-data" type="application/json">null</script>
<script>
"use strict";
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "Mon"];
const REVENUE = ["linehaul", "fuel_surcharge", "detention_pay", "tonu_fee", "terminal_in_transit"];
const STATE = { loaded: "Loaded", empty: "Empty (deadhead)", stopped: "Stopped (dock or idle)", resting: "Resting (HOS)", detention: "Detention", broken: "Broken down", held: "Held by a closed road" };
const STATE_FILL = { resting: "var(--st-rest)", stopped: "var(--st-stop)", detention: "var(--st-det)", broken: "var(--st-broken)", held: "url(#hatch-held)" };
const ICON = { detention: "⏱", broken: "⚠", resting: "z", held: "⛔" };
const UNIT = { tractor_dry: { label: "tractor, 53' dry van", size: 1, tag: "" }, tractor_reefer: { label: "tractor, 53' reefer", size: 1, tag: "" },
               box: { label: "26' box truck", size: 0.82, tag: " · box" }, van: { label: "cargo van", size: 0.66, tag: " · van" } };
const unitOf = t => { const u = UNIT[t.class] || { label: t.equipment === "reefer" ? "reefer truck" : "dry van truck", size: 1, tag: "" };   // v1 replays: no class
  return t.owner === "owner_operator" ? { ...u, label: u.label + ", an owner-operator's", tag: u.tag + " · owner-op" } : u; };
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = v => v == null ? "—" : (v < 0 ? "−" : "") + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
const fix = (v, d = 3) => v == null ? "—" : Number(v).toFixed(d);
const clockOf = t => { const d = Math.floor(t / 96), m = (t % 96) * 15; return `${DAYS[Math.min(d, 7)]} ${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const seatColor = s => `var(--seat-${s})`;
const shortModel = m => (m || "").split("/").pop();
const weekOf = task => (String(task).match(/\d{4}-\d{2}-\d{2}/) || [""])[0];   // ts-2019-10-07-A-s16, ts-v11-2019-10-07-A-s16
const nick = m => shortModel(m).replace(/^claude-/, "");          // where a label has little room: haiku-5-5
const tip = $("tip");
const showTip = (h, ev) => { tip.innerHTML = h; tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; };
const hideTip = () => { tip.style.display = "none"; };
$("theme").addEventListener("click", () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; localStorage.setItem("trucksim-theme", r.dataset.theme); });
if (localStorage.getItem("trucksim-theme")) document.documentElement.dataset.theme = localStorage.getItem("trucksim-theme");
if (new URLSearchParams(location.search).get("theme")) document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme");

// ---------------- data ----------------
let SITE = JSON.parse($("site-data").textContent);
const docCache = {};
async function loadSite() {
  if (SITE) return SITE;
  const r = await fetch("site.json");
  if (!r.ok) throw new Error(`no site.json here (HTTP ${r.status})`);
  return (SITE = await r.json());
}
async function loadDoc(id) {
  if (SITE.docs && SITE.docs[id]) return SITE.docs[id];
  if (docCache[id]) return docCache[id];
  const r = await fetch(`runs/${encodeURIComponent(id)}.json`);
  if (!r.ok) throw new Error(`no replay for ${id} (HTTP ${r.status})`);
  return (docCache[id] = await r.json());
}
function bootstrap(vals, draws = 2000) {   // a fixed-seed bootstrap over weeks, as the results board computes it
  let s = 7; const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const means = []; for (let i = 0; i < draws; i++) { let a = 0; for (let j = 0; j < vals.length; j++) a += vals[Math.floor(rnd() * vals.length)]; means.push(a / vals.length); }
  means.sort((a, b) => a - b); return [means[Math.floor(0.025 * draws)], means[Math.floor(0.975 * draws) - 1]];
}

// ---------------- routing ----------------
let teardown = null;
async function route() {
  if (teardown) { teardown(); teardown = null; }
  hideTip();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll("header nav a[data-tab]").forEach(a => a.classList.toggle("on", (parts[0] || "overview") === a.dataset.tab || (parts[0] === "run" && a.dataset.tab === "runs")));
  const main = $("main");
  try {
    if (parts[0] === "live") return await livePage(main, parts[1]);
    await loadSite();
    if (!parts.length && (SITE.runs || []).length === 1) return await runPage(main, SITE.runs[0].id);
    if (!parts.length) return overview(main);
    if (parts[0] === "runs") return explorer(main);
    if (parts[0] === "run") return await runPage(main, parts[1]);
    main.innerHTML = `<div class="ov-page">Nothing at ${esc(location.hash)}.</div>`;
  } catch (e) { main.innerHTML = `<div class="ov-page"><h1>Couldn't load this page</h1><p>${esc(e.message)}</p></div>`; }
}
addEventListener("hashchange", route);
const crumbs = items => { $("crumbs").innerHTML = items.map((x, i) => (i ? '<span class="sep">/</span>' : "") + (x.href ? `<a href="${x.href}">${esc(x.text)}</a>` : `<span>${esc(x.text)}</span>`)).join(""); };

// ---------------- overview ----------------
function boardRows(runs) {
  const by = {};
  runs.forEach(r => (by[r.model] ||= []).push(r));
  return Object.entries(by).map(([model, rs]) => {
    const ok = rs.filter(r => r.reward != null), rew = ok.map(r => r.reward), mean = k => ok.reduce((a, r) => a + (r[k] || 0), 0) / (ok.length || 1);
    const tok = k => ok.reduce((a, r) => a + ((r.usage || {})[k] || 0), 0) / (ok.length || 1);
    const [lo, hi] = rew.length > 1 ? bootstrap(rew) : [null, null];
    return { model, weeks: ok.length, runs: rs.length, reward: rew.reduce((a, b) => a + b, 0) / (rew.length || 1), lo, hi,
             profit: mean("profit_usd"), loads: mean("delivered"), calls: mean("tool_calls"), tin: tok("input_tokens"), tout: tok("output_tokens"), min: mean("seconds") / 60 };
  }).sort((a, b) => b.reward - a.reward);
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const niceWeek = monday => { const [y, m, d] = monday.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const HUBS = { A: "Dallas", B: "Houston", C: "San Antonio" };
const madeOrLost = v => v < 0 ? `lost ${money(-v)}` : `made ${money(v)}`;
function ruler(ex) {
  // A worked example on one real week: where the simple dispatcher, the optimizer and the model land on the score.
  const pts = [["simple dispatcher", ex.naive_usd, 0.2], ["optimizer", ex.anchor_usd, 1.0], [shortModel(ex.model), ex.profit_usd, ex.reward]];
  const lo = Math.min(0, ...pts.map(p => p[2])), hi = Math.max(1.2, ...pts.map(p => p[2])) + 0.1, W = 760, L = 40, Rr = 110;
  const x = s => L + (s - lo) / (hi - lo) * (W - L - Rr);
  const ticks = [0, 0.2, 0.5, 1.0, 1.5, 2.0].filter(t => t <= hi);
  const Y = 66;   // labels sit above the line, staggered so close points don't collide; the scale's numbers below
  return `<svg viewBox="0 0 ${W} 124" width="100%" style="max-width:${W}px;display:block;margin:6px 0 2px" role="img" aria-label="The score as a ruler on one week">
    <line x1="${x(lo)}" x2="${x(hi)}" y1="${Y}" y2="${Y}" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
    <rect x="${x(0.2)}" y="${Y - 3}" width="${x(1.0) - x(0.2)}" height="6" fill="var(--faint)" opacity=".55"/>
    ${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="${Y + 6}" y2="${Y + 12}" stroke="var(--faint)"/><text x="${x(t)}" y="${Y + 25}" font-size="11" fill="var(--muted)" text-anchor="middle">score ${t.toFixed(1)}</text>`).join("")}
    ${pts.map(([name, usd, s], i) => `<g transform="translate(${x(s)},${Y})"><line y1="-8" y2="${i === 1 ? -36 : -18}" stroke="var(--faint)"/><circle r="7" fill="${i === 2 ? "var(--now)" : "var(--fg)"}" stroke="var(--bg)" stroke-width="2"/>

    const GH = 4 * RHt + 34;
    eld.setAttribute("viewBox", `0 0 ${EW} ${Math.max(1, logs.length) * GH + 8}`);
    if (!logs.length) { el("text", { x: EW / 2, y: 60, "font-size": 12, fill: "var(--muted)", "text-anchor": "middle" }, eld).textContent = "Parked at the hub: nobody on this unit now"; return; }
    const ex = tick => EM.l + (tick - d0) / 96 * (EW - EM.l - EM.r);
    logs.forEach(([name, log], k) => {
      const top = EM.t + k * GH, ey = c => top + ROWS.indexOf(c) * RHt + RHt / 2;
      const segs = log.map(([a, b, s]) => [Math.max(a, d0), Math.min(b, d0 + 96), s]).filter(([a, b]) => b > a);
      if (logs.length > 1) el("text", { x: 4, y: top - 6, "font-size": 10.5, "font-weight": 600, fill: "var(--fg)" }, eld).textContent = name;
      ROWS.forEach((c, i) => { el("rect", { x: EM.l, y: top + i * RHt, width: EW - EM.l - EM.r, height: RHt, fill: i % 2 ? "var(--band)" : "transparent" }, eld);
        el("text", { x: EM.l - 8, y: top + i * RHt + RHt / 2 + 4, "font-size": 10.5, fill: "var(--muted)", "text-anchor": "end" }, eld).textContent = LBL[c];
        el("text", { x: EW - EM.r + 6, y: top + i * RHt + RHt / 2 + 4, "font-size": 10.5, fill: "var(--fg)" }, eld).textContent = (segs.filter(s => s[2] === c).reduce((acc, [x, y]) => acc + y - x, 0) / 4).toFixed(2).replace(/\.00$/, "") + " h"; });
      for (let h = 0; h <= 24; h++) { el("line", { x1: ex(d0 + h * 4), x2: ex(d0 + h * 4), y1: top, y2: top + 4 * RHt, stroke: "var(--gridc)" }, eld);
        if (h % 2 === 0 && k === 0) el("text", { x: ex(d0 + h * 4), y: top - 6, "font-size": 10, fill: "var(--muted)", "text-anchor": "middle" }, eld).textContent = h === 0 || h === 24 ? "Mid" : h === 12 ? "Noon" : String(h > 12 ? h - 12 : h); }
      el("rect", { x: EM.l, y: top, width: EW - EM.l - EM.r, height: 4 * RHt, fill: "none", stroke: "var(--line)" }, eld);
      segs.forEach(([a, b, s], i) => { const y = ey(s);
        if (i) el("line", { x1: ex(a), x2: ex(a), y1: ey(segs[i - 1][2]), y2: y, stroke: a <= st.now ? "var(--fg)" : "var(--faint)", "stroke-width": 2 }, eld);
        if (a < st.now && st.now < b) { el("line", { x1: ex(a), x2: ex(st.now), y1: y, y2: y, stroke: "var(--fg)", "stroke-width": 2 }, eld); el("line", { x1: ex(st.now), x2: ex(b), y1: y, y2: y, stroke: "var(--faint)", "stroke-width": 2, "stroke-dasharray": "4 3" }, eld); }
        else el("line", { x1: ex(a), x2: ex(b), y1: y, y2: y, stroke: b <= st.now ? "var(--fg)" : "var(--faint)", "stroke-width": 2, "stroke-dasharray": b <= st.now ? "" : "4 3" }, eld); });
      if (st.now >= d0 && st.now <= d0 + 96) el("line", { x1: ex(st.now), x2: ex(st.now), y1: top - 2, y2: top + 4 * RHt + 2, stroke: "var(--now)", "stroke-width": 1.2 }, eld);
    });
  }

  // ---- the watch panel: this turn ----
  const describe = e => {
    switch (e.kind) {
      case "claim_won": return `Won ${e.load}${e.contested ? " (contested)" : ""}`;
      case "claim_lost": return `Lost ${e.load}: ${e.reason}`;
      case "dispatch": return `${e.truck} dispatched: ${e.loads.join(", ") || "plan cleared"}`;
      case "reposition": return `${e.truck} repositioning to ${cities[e.city].name}`;
      case "picked": return `${e.truck} loaded ${e.load} (${(e.dwell / 4).toFixed(1)} h at the dock)`;
      case "delivered": return `${e.truck} delivered ${e.load}${e.late_h ? `, ${e.late_h} h late` : ", on time"}: +${money(e.revenue_usd)}`;
      case "missed_pickup": return `Missed the pickup of ${e.load} (−${money(e.penalty)})`;
      case "load_cancelled": return `${e.load} cancelled by the shipper${e.tonu_usd ? ` (TONU +${money(e.tonu_usd)})` : ""}`;
      case "released": return `Released ${e.load} (−${money(e.penalty)})`;
      case "breakdown": return `⚠ ${e.truck}: ${e.component} failed, ${e.where}`;
      case "fault_warning": return `${e.truck}: fault code (${e.component})`;
      case "repair_ordered": return `${e.truck}: ${e.option} repair ordered (${money(e.usd)})`;
      case "repaired": return `${e.truck} repaired`;
      case "maintenance_booked": return `${e.truck} booked for maintenance in ${cities[e.city].name}`;
      case "rest": return `${e.truck}'s driver rests until ${clockOf(e.until)} (${e.reason})`;
      case "closure_start": return `${e.road.replace(" ", "-")} closed ${closureWay(e)} (${e.cause}, ${e.where}${e.source === "NOAA narrative" ? ", reported by NOAA" : ""}); reopens about ${clockOf(e.reopens_about)}`;
      case "closure_end": return `${e.road.replace(" ", "-")} reopened`;
      case "held": return `${e.truck} stopped by the ${e.road.replace(" ", "-")} closure, ${e.where}`;
      case "detour": return `${e.truck} detours: ${e.via.map(c => cities[c].name).join(" → ")}`;
      case "turned_back": return `${e.truck} turns back from a closed road: ${e.via.map(c => cities[c].name).join(" → ")}`;
      case "adverse_conditions": return `${e.truck}'s driver gets 2 more hours (adverse driving conditions, 49 CFR 395.1(b)(1))`;
      case "crew_change": return `${e.truck} crew now ${e.crew.length ? e.crew.map(driverName).join(" & ") : "nobody"}`;
      case "declined": return `${e.truck}'s owner-operator ${e.owner} turned down ${(e.loads || []).join(", ") || "the trip"}: ${e.why}`;
      case "temp_hired": return `Temp driver ${e.driver} called: at the hub ${clockOf(e.arrives)}, until ${clockOf(e.until)}`;
      case "temp_left": return `Temp driver ${e.driver} went home`;
      case "weather_start": return `${e.type}: ${e.where || cities[e.city].name}`;
      case "weather_end": return `${e.type} over: ${e.where || cities[e.city].name}`;
      case "week_over": return `Week over: ${Object.entries(e.profit).map(([s, p]) => `${s} ${money(p)}`).join(" · ")}`;
      default: return null;
    }
  };
  function drawWatch() {
    const turn = Math.min(27, Math.floor(Math.max(0, st.now - 1) / R.week.turn_ticks)), t0 = turn * R.week.turn_ticks, t1 = t0 + R.week.turn_ticks;
    $("w-title").textContent = `Turn ${turn + 1} of 28`;
    $("w-sub").textContent = `${clockOf(t0)} to ${clockOf(t1)} · seat ${st.seat}`;
    const rows = [], storm = {};   // one line per kind of storm starting (or ending) at one time: NOAA files a storm per county
    R.events.filter(e => e.t <= st.now && e.t >= t0 - R.week.turn_ticks && (e.seat === st.seat || e.kind.startsWith("weather") || e.kind.startsWith("closure") || e.kind === "week_over")).forEach(e => {
      const d = describe(e); if (!d) return;
      if (!e.kind.startsWith("weather")) { rows.push({ e, d }); return; }
      const k = `${e.t}|${e.kind}|${e.type}`, place = e.where || e.city;
      if (storm[k]) { storm[k].places.add(place); return; }
      rows.push(storm[k] = { e, d, places: new Set([place]) });
    });
    $("feed").innerHTML = rows.slice(-40).reverse().map(({ e, d, places }) => `<li class="${e.t >= t0 ? "new" : ""}"><span class="t">${clockOf(e.t)}</span>${esc(d)}${places && places.size > 1 ? ` and ${places.size - 1} more place${places.size > 2 ? "s" : ""}` : ""}</li>`).join("") || `<li class="empty">Nothing this turn yet.</li>`;
    const a = R.agents[st.seat], ul = $("calls");
    $("calls-h").textContent = R.seats[st.seat].model ? `The operator (${shortModel(a ? a.model : model)}) on turn ${turn + 1}` : `Seat ${st.seat}: a rival`;
    if (!R.seats[st.seat].model) { ul.innerHTML = `<li class="empty">The game's AI (the re-planner) plays this seat, through the same tools.</li>`; return; }
    if (!a) { ul.innerHTML = `<li class="empty">${live ? "The model's calls arrive when the week is over: the agent hands back its trajectory then." : "No trajectory in this replay."}</li>`; return; }
    const rec = a.turns.find(x => x.turn === turn);
    if (!rec) { ul.innerHTML = `<li class="empty">No record for this turn.</li>`; return; }
    ul.innerHTML = rec.calls.map(c => c.say ? `<li class="say">${esc(c.say).slice(0, 700)}</li>` : `<li><code>${esc(c.tool)}</code> <code class="muted">${esc(JSON.stringify(c.args)).slice(0, 220)}</code><span class="res">${esc(String(c.out)).slice(0, 420)}</span></li>`).join("")
      + `<li class="notes"><b>Notes for next turn</b> <span class="muted">(turn ended by the ${esc(rec.ended_by)})</span><span class="res">${esc(rec.notes || "")}</span></li>`;
  }
  function drawDrivers() {   // v1.1: who is on which unit now, and how long each has driven today
    const mine = (R.drivers || []).filter(d => d.seat === st.seat);
    $("drivers-sec").style.display = mine.length ? "" : "none";
    if (!mine.length) return;
    const on = {};
    trucksBySeat[st.seat].forEach(t => (truckXY(R, t.id, st.now).s[6] || []).forEach(id => { on[id] = t.id; }));
    const day = Math.min(6, Math.floor(Math.max(0, st.now - 1) / 96)), d0 = day * 96;
    const drove = id => (R.duty[id] || []).reduce((acc, [a, b, s]) => acc + (s === "D" ? Math.max(0, Math.min(b, st.now, d0 + 96) - Math.max(a, d0)) : 0), 0) / 4;
    const KIND = { company: "company, by the mile", local: "local, hourly", owner_operator: "owner-operator", temp: "temp" };
    $("drv-sub").textContent = `seat ${st.seat}, ${DAYS[day]}`;
    $("drivers").innerHTML = `<thead><tr><th>Driver</th><th>Kind</th><th>Now</th><th class="r">Driven today</th></tr></thead><tbody>${mine.map(d => `<tr${on[d.id] ? ` class="click" data-truck="${on[d.id]}"` : ""}${on[d.id] === st.truck ? ' style="background:var(--sel)"' : ""}><td>${esc(d.name)}</td><td class="muted">${esc(KIND[d.kind] || d.kind)}</td><td>${on[d.id] ? esc(on[d.id]) : '<span class="muted">at home</span>'}</td><td class="r">${drove(d.id).toFixed(1)} h</td></tr>`).join("")}</tbody>`;
    $("drivers").querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => { st.truck = tr.dataset.truck; render(); }));
  }
  function drawSeats() {
    $("seats").innerHTML = `<thead><tr><th>Seat</th><th>Played by</th><th class="r">Profit</th><th class="r">Delivered</th></tr></thead><tbody>${seatIds.map(s => `<tr class="click" data-seat="${s}"${s === st.seat ? ' style="background:var(--sel)"' : ""}><td><span class="dot" style="background:${seatColor(s)}"></span>${s} ${esc(cities[R.seats[s].hub].name)}</td><td>${R.seats[s].model ? esc(shortModel(model)) : "re-planner (rival)"}</td><td class="r">${money(profitAt(s, st.now))}</td><td class="r">${R.events.filter(e => e.kind === "delivered" && e.seat === s && e.t <= st.now).length}</td></tr>`).join("")}</tbody>`;
    $("seats").querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => { st.seat = tr.dataset.seat; st.truck = trucksBySeat[st.seat][0].id; render(); }));
  }
  function drawCard() {
    const states = {}; trucksBySeat[st.seat].forEach(t => { const s = truckXY(R, t.id, st.now).s[4]; states[s] = (states[s] || 0) + 1; });
    const cnt = k => states[k] || 0;
    $("card").innerHTML = `<div class="ttl">Seat ${st.seat} · ${esc(cities[R.seats[st.seat].hub].name)}</div>
      <div class="big"><b>${money(profitAt(st.seat, st.now))}</b> <span style="color:#a5bac5">so far</span></div>
      <div class="sm">${cnt("loaded")} loaded · ${cnt("empty")} empty · ${cnt("resting")} resting · ${cnt("stopped") + cnt("detention")} stopped${cnt("held") ? ` · <span style="color:#ff9a8f">${cnt("held")} held by a closed road</span>` : ""}${cnt("broken") ? ` · <span style="color:#ff9a8f">${cnt("broken")} broken down</span>` : ""}</div>
      ${(() => { const shutNow = closures.filter(c => c.from <= st.now && st.now < c.to); return shutNow.length ? `<div class="sm">⛔ ${shutNow.length} road${shutNow.length > 1 ? "s" : ""} closed: ${[...new Set(shutNow.map(c => c.road.replace(" ", "-")))].slice(0, 3).map(esc).join(", ")}${shutNow.length > 3 ? "…" : ""}</div>` : ""; })()}
      ${st.ghostDoc ? (() => { const gs = ghostTrucks(), split = gs.filter(x => x.apart).length, them = valueAt(st.ghostSeries, st.now), us = profitAt(modelSeat, st.now);
        return `<div class="sm cmp"><span class="ring" style="border-color:${seatColor(modelSeat)}"></span>Rings: ${esc(nick(st.ghost))}'s run, at <b class="nw">${money(them)}</b> so far (${esc(nick(model))} <span class="nw">${us >= them ? "+" : "−"}${money(Math.abs(us - them))}</span>). ${split ? `${split} of ${gs.length} trucks elsewhere, dotted to the same truck here.` : "Every truck in the same place right now."}</div>`; })() : ""}
      <div class="sm">${(() => { const now = wx.filter(w => w.from <= st.now && st.now < w.to);
        if (now.some(w => w.spans)) { const roads = [...new Set(now.flatMap(w => (w.spans || []).map(([a, b]) => `${edgeOf[a + ">" + b].route.replace(" ", "-")} ${cities[a].name}–${cities[b].name}`)))];
          return `Storms slowing ${roads.length} road${roads.length > 1 ? "s" : ""}: ${roads.slice(0, 3).map(esc).join(", ")}${roads.length > 3 ? "…" : ""}`; }
        const on = [...new Set(now.map(w => w.city))]; return on.length ? `Weather slowing roads at ${on.length} cit${on.length > 1 ? "ies" : "y"}: ${on.slice(0, 4).map(c => esc(cities[c].name)).join(", ")}${on.length > 4 ? "…" : ""}` : "No weather under way"; })()}</div>`;
  }
  function render() {
    const turn = Math.min(28, Math.floor(Math.max(0, st.now - 1) / R.week.turn_ticks) + 1);
    $("stepl").textContent = `Turn ${turn} of 28`;
    $("status").innerHTML = `<span class="dot" style="background:${seatColor(st.seat)}"></span>seat ${st.seat}${modelSeat === st.seat && reward != null ? ` · score ${fix(reward)}${live ? " so far" : ""}` : ""}`;
    $("clock-b").textContent = clockOf(Math.round(st.now)) + (live ? " · live" : "");
    $("clock-s").textContent = `week of ${R.week.monday} · h ${Math.floor(st.now / 4)}`;
    $("range").value = st.now;
    if (st.raceNow) { const x = st.rx(st.now); st.raceNow.setAttribute("x1", x); st.raceNow.setAttribute("x2", x); }
    if (st.fleetNow) { const x = fx(st.now); st.fleetNow.setAttribute("x1", x); st.fleetNow.setAttribute("x2", x); }
    drawMap(); drawCard(); drawWatch(); drawSeats(); drawDrivers(); drawEld();
  }
  drawFleetStatic(); drawRaceStatic();
  $("range").addEventListener("input", ev => { st.now = +ev.target.value; render(); });
  $("prev").addEventListener("click", () => { st.now = Math.max(0, (Math.ceil(st.now / 24) - 1) * 24); render(); });
  $("next").addEventListener("click", () => { st.now = Math.min(end, (Math.floor(st.now / 24) + 1) * 24); render(); });
  $("b-names").addEventListener("click", ev => { st.names = !st.names; ev.target.setAttribute("aria-pressed", st.names); render(); });
  $("b-wx").addEventListener("click", ev => { st.wx = !st.wx; ev.target.setAttribute("aria-pressed", st.wx); render(); });
  $("b-reset").addEventListener("click", () => { st.now = 0; st.seat = modelSeat || seatIds[0]; st.truck = trucksBySeat[st.seat][0].id; render(); });
  $("b-names").setAttribute("aria-pressed", st.names); $("b-wx").setAttribute("aria-pressed", st.wx);
  if ($("ghost")) $("ghost").addEventListener("change", async ev => {
    const id = ev.target.value; st.ghost = id ? (SITE.runs.find(r => r.id === id) || {}).model : null; st.ghostDoc = id ? await loadDoc(id) : null;
    st.ghostSeries = st.ghostDoc && modelSeat ? seriesOf(st.ghostDoc, modelSeat, st.ghostDoc.week.week_ticks) : null;
    drawRaceStatic(); render();
  });
  $("play").addEventListener("click", ev => {
    if (st.timer) { clearInterval(st.timer); st.timer = null; ev.target.textContent = "▶"; return; }
    if (st.now >= end) st.now = 0;
    ev.target.textContent = "❚❚";
    st.timer = setInterval(() => { st.now = Math.min(end, st.now + 4 * (+$("speed").value) / 20); render(); if (st.now >= end) { clearInterval(st.timer); st.timer = null; ev.target.textContent = "▶"; } }, 50);
  });
  render();
  return { destroy() { if (st.timer) clearInterval(st.timer); }, state() { return { now: st.now >= end ? null : st.now, seat: st.seat, truck: st.truck, names: st.names, wx: st.wx }; } };
}

route();
</script>
</body>
</html>
