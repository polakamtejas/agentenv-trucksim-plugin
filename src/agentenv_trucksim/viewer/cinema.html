<title>TruckSim Playthrough</title>
<!-- The 3D playthrough of one run: MapLibre (the map, OpenFreeMap's tiles) under deck.gl (roads, weather, closures,
     Kenney's trucks), a camera director, and the agent's turns as an overlay. Served from a site folder (replay_page.py):
     cinema.html?run=<id> reads runs/<id>.json, road_shapes.json and models/. ?record=1 is the video renderer's mode
     (scripts/render_cinema.py): no controls, and window.cinema.seek(t) draws the frame at t seconds. -->
<link rel="stylesheet" href="vendor/maplibre-gl-6.14.0/maplibre-gl.css">
<style>
:root {
  --panel: rgba(14, 18, 24, .78); --panel-line: rgba(255, 255, 255, .08); --fg: #eef1f5; --muted: #9ba4b0; --faint: #66707c;
  --accent: #f2a23a; --ok: #63d69a; --warn: #f2b84b; --red: #ff6155; --ice: #a9d6ff;

  --sans: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
#hud { position: fixed; left: 0; top: 0; width: 1920px; transform-origin: 0 0; pointer-events: none; z-index: 3; }
#hud * { box-sizing: border-box; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 14px 16px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ph { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.ph b { color: var(--fg); font-weight: 600; }
.ph .r { letter-spacing: .02em; text-transform: none; color: var(--faint); font-size: 12px; }

.badge.out { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }

#tl { position: absolute; left: 36px; top: 30px; width: 540px; }
#tl::before { content: ""; position: absolute; left: -36px; top: -30px; width: 660px; height: 380px; z-index: -1;
  background: radial-gradient(ellipse at 20% 30%, rgba(7,9,12,.88), rgba(7,9,12,.6) 55%, rgba(7,9,12,0) 75%); }
#tl .kick { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
#tl h1 { margin: 12px 0 6px; font-size: 27px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
#tl .who { font-size: 15px; font-weight: 600; color: var(--accent); }
#tl .desc { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: #c8cfd8; text-shadow: 0 1px 8px rgba(0,0,0,.8); max-width: 520px; }
#tl .clockrow { display: flex; gap: 14px; align-items: baseline; margin-top: 14px; }
#tl .clock { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
#tl .date { font-size: 15px; color: var(--muted); }

  background: linear-gradient(180deg, rgba(10,13,18,.72), rgba(10,13,18,.5)); border: 1px solid rgba(255,255,255,.06); }
#cap h2 { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.01em; }

#result .ruler { position: relative; width: 1000px; height: 120px; margin: 40px auto 6px; }
#result .ruler .ln { position: absolute; left: 0; right: 0; top: 60px; height: 3px; background: rgba(255,255,255,.15); }
#result .ruler .pt { position: absolute; top: 0; height: 120px; }

#result .ruler .pt .lb.below { top: 78px; } #result .ruler .pt .lb.above { bottom: 74px; }
#result .ruler .pt b { display: block; font-size: 16px; }

.lab { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 700; border-radius: 999px; padding: 3px 9px;
  font-size: calc(13px * var(--s)); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.lab.money { background: rgba(10,14,18,.86); border: 1.5px solid currentColor; }

.lab.ev { background: rgba(10,14,18,.9); color: var(--fg); border: 1.5px solid var(--warn); }

#controls { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 4; display: flex; gap: 8px; align-items: center;
  background: rgba(14,18,24,.88); border: 1px solid var(--panel-line); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
#controls[hidden] { display: none; }
#controls button, #controls select { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
#controls input[type=range] { width: 360px; accent-color: var(--accent); }
#controls a { color: var(--muted); }
#err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; background: #07090c; color: var(--red); font: 15px var(--mono); padding: 40px; white-space: pre-wrap; }
</style>

<div id="map"></div>

<div id="hud">
  <div id="tl">

    <h1 id="title"></h1>

  <div class="panel" id="pnl"><div class="ph"><span>Company <b id="pnlseat"></b></span><span class="r">this week so far</span></div>
    <div class="big" id="profit"></div><div class="bigsub">profit: revenue earned minus every cost paid</div><div id="pnlrows"></div></div>
  <div class="panel" id="race"><div class="ph"><span>Profit race</span><span class="r">same week, same freight, three companies</span></div><svg id="racesvg" width="606" height="160"></svg></div>

<script type="importmap">{ "imports": { "@deck.gl/core": "./vendor/deck.gl-core-shim.mjs" } }</script>
<script type="module">
import * as maplibregl from "./vendor/maplibre-gl-6.14.0/maplibre-gl.mjs";
import { MapLibreOverlay } from "./vendor/deck.gl-maplibre-9.4.0/index.js";
import { D2R, M_PER_DEG, clamp, lerp, smooth, smoother, lerpAngle, hash, esc, money, plural, DAYS, clockOf, offset, metersBetween, bearingOf, step, getJSON, SEAT_RGB, unitMeters, dayness, runModel } from "./runmodel.mjs";

const D = window.deck;
const Q = new URLSearchParams(location.search);
const RECORD = Q.has("record");
const fail = e => { const el = document.getElementById("err"); el.style.display = "flex"; el.textContent = "The playthrough could not start:\n" + (e && e.stack || e); window.cinema = { error: String(e && e.stack || e) }; };
window.addEventListener("error", ev => fail(ev.error || ev.message));
window.addEventListener("unhandledrejection", ev => fail(ev.reason));

const $ = id => document.getElementById(id);
const seatCss = s => `var(--seat-${s})`;

// ---- the run -------------------------------------------------------------------------------------------------------
const SITE = await getJSON("site.json");
const RUNS = SITE.runs || [];
const RUN_ID = Q.get("run") || (RUNS[0] && RUNS[0].id);
if (!RUN_ID) throw new Error("no run: open cinema.html?run=<id> (site.json lists none)");
const [R, SHAPES] = await Promise.all([getJSON(`runs/${encodeURIComponent(RUN_ID)}.json`), getJSON("road_shapes.json")]);
const SUMMARY = RUNS.find(r => r.id === RUN_ID) || {};
const { SEAT, AGENT, MODEL, SEATS, WEEK, TT, NT, TURN, MONDAY, dateOf, shortDate, CITY, HUB, HUB_NAME, TRUCK, UNIT_INDEX, DRIVER, modelOf, UNIT_LABEL, EDGE, ROADS, edgeOf, along, stretch, LOT, slot, SNAP, snapAt, logical, world, pose, TRIPS, WX, WX_CITY, WX_LIST, WX_KIND, WX_RGB, weatherAt, CLOSURES, closuresAt, REVENUE, BOOKS, booksAt, REFS, SCORE, callLine, FEED, firstSentences, KEY, LOADS, DISPATCHES, truckOfLoad, MINE, KEY_EVENTS, crewNames, route, eventCaption, truckBlurb } = runModel(R, SHAPES, { id: RUN_ID, model: SUMMARY.model, lane: S => 0.9 * S });

// ---- the timeline: intro, then each turn's planning pause and its six hours, then the outro ------------------------
const INTRO = 8, OUTRO = 17, RUN = 4.2, SLOW = 2.6, FLY = 2.0;
const slowTicks = new Set(); KEY_EVENTS.forEach(e => { for (let k = -2; k <= 3; k++) slowTicks.add(Math.floor(e.t) + k); });
const SEG = [{ kind: "intro", t0: 0, t1: INTRO, tick: 0 }];
const TICK_T = new Float64Array(WEEK + 1);
let T0 = INTRO;
for (let k = 0; k < NT; k++) {
  const n = (FEED[k] || []).length, P = clamp(1.3 + 0.12 * n, 1.8, 3.4);
  SEG.push({ kind: "plan", turn: k, t0: T0, t1: T0 + P, tick: k * TT }); T0 += P;
  const cum = [0]; for (let i = 0; i < TT; i++) cum.push(cum[i] + RUN / TT * (slowTicks.has(k * TT + i) ? SLOW : 1));
  for (let i = 0; i < TT; i++) TICK_T[k * TT + i] = T0 + cum[i];
  SEG.push({ kind: "run", turn: k, t0: T0, t1: T0 + cum[TT], tick0: k * TT, cum }); T0 += cum[TT];
}
TICK_T[WEEK] = T0;
SEG.push({ kind: "outro", t0: T0, t1: T0 + OUTRO, tick: WEEK });
const DURATION = T0 + OUTRO;
SEG.forEach((s, i) => { s.i = i; });
function segAt(T) { let lo = 0, hi = SEG.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (SEG[m].t0 <= T) lo = m; else hi = m - 1; } return SEG[lo]; }
function tickAt(T) {
  const s = segAt(T);
  if (s.kind !== "run") return s.tick;
  const x = clamp(T - s.t0, 0, s.cum[TT]); let i = 0; while (i < TT - 1 && s.cum[i + 1] <= x) i++;
  return s.tick0 + i + (x - s.cum[i]) / (s.cum[i + 1] - s.cum[i]);
}
const timeOfTick = tk => TICK_T[clamp(Math.floor(tk), 0, WEEK)] + (tk - Math.floor(tk)) * RUN / TT;

// ---- the director: one shot per turn, chosen from what happens in it -----------------------------------------------
const lats = R.board.cities.map(c => c.lat), lons = R.board.cities.map(c => c.lon);
const BOARD_C = [(Math.min(...lons) + Math.max(...lons)) / 2, (Math.min(...lats) + Math.max(...lats)) / 2 - 0.9];
function roadTime(tid, lo, hi) { let n = 0; for (let k = lo; k < hi; k += 1) { const L = logical(tid, k); if (!L.city) n += L.state === "loaded" ? 1.3 : 1; } return n; }
const SHOTS = [{ kind: "intro", t0: 0 }];
for (let k = 0, prev = null, lastRegion = -9; k < NT; k++) {
  const lo = k * TT, hi = lo + TT, t0 = SEG[1 + 2 * k].t0;
  let shot = null;
  const ev = KEY_EVENTS.filter(e => e.t >= lo && e.t < hi && e.truck).sort((a, b) => KEY[b.kind] - KEY[a.kind] || a.t - b.t)[0];
  const fresh = CLOSURES.filter(c => c.from >= lo && c.from < hi && c.to - c.from >= 16).sort((a, b) => (b.m1 - b.m0) - (a.m1 - a.m0) || (a.closure_id < b.closure_id ? -1 : 1));
  if (ev) shot = { kind: "follow", truck: ev.truck, ev };
  else if (fresh.length && k - lastRegion > 3) { shot = { kind: "region", at: fresh[0].mid, brg0: (fresh[0].ends[0].brg + 70) % 360, closure: fresh[0] }; lastRegion = k; }
  else if (k % 5 === 2) shot = { kind: "board" };
  else {
    const mine = R.trucks.filter(t => t.seat === SEAT).map(t => ({ id: t.id, v: roadTime(t.id, lo, hi) * (prev && prev.truck === t.id ? 0.6 : 1) + hash(t.id + k) * 0.1 }));
    const best = mine.sort((a, b) => b.v - a.v)[0];
    shot = best && best.v > 2 ? { kind: "follow", truck: best.id } : { kind: "hub" };
  }
  shot.t0 = t0; shot.turn = k; SHOTS.push(shot); prev = shot;
}
SHOTS.push({ kind: "outro", t0: SEG[SEG.length - 1].t0 });
function shotAt(T) { let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1].t0 <= T) i++; return i; }

const FOLLOW_Z = 9.7;
function motionBearing(tid, tick, S) {   // the direction a truck has been going, smoothed; null if it hardly moved
  let ex = 0, ny = 0;
  for (let k = -3; k <= 3; k += 0.5) {
    const a = world(tid, tick + k - 0.25, S).p, b = world(tid, tick + k + 0.25, S).p, w = 1 - Math.abs(k) / 3.5;
    ex += (b[0] - a[0]) * Math.cos(a[1] * D2R) * w; ny += (b[1] - a[1]) * w;
  }
  const m = Math.hypot(ex, ny) * M_PER_DEG;
  return { brg: (Math.atan2(ex, ny) / D2R + 360) % 360, m };
}
function camFor(shot, T, tick) {
  const u = T - shot.t0;
  switch (shot.kind) {
    case "intro": { const e = smoother(T / INTRO); return { center: [lerp(-95.6, BOARD_C[0], e), lerp(29.4, BOARD_C[1], e)], zoom: lerp(4.9, 6.05, e), pitch: lerp(20, 46, e), bearing: lerp(-28, -10, e) }; }
    case "board": return { center: BOARD_C, zoom: 6.05, pitch: 46, bearing: -10 + 6 * Math.sin(u * 0.08) };
    case "outro": return { center: BOARD_C, zoom: lerp(6.05, 5.75, smooth(u / 10)), pitch: lerp(46, 38, smooth(u / 10)), bearing: -10 + u * 1.2 };

    const shot = SHOTS[shotAt(T)];
    if (shot.ev && tick >= shot.ev.t - 2) { const [a, b] = eventCaption(shot.ev); ct = a; cx = esc(b); }
    else if (shot.kind === "region") { const c = shot.closure; ct = `${route(c.road)} closes`; cx = esc(`${c.cause} · ${c.where}. ${c.source === "NOAA narrative" ? "NOAA's report: " + c.what : "Modeled from the storm."} Announced to reopen about ${clockOf(c.reopens_about)}.`); }
    else if (shot.kind === "board") { const w = weatherAt(tick).length, c = closuresAt(tick).length; ct = `${DAYS[Math.floor(tick / 96)]}: the whole board`; cx = esc(`Three companies, ${R.trucks.length} units. ${w ? `${w} road stretches under storms` : "Clear roads"}${c ? `, ${c} closed` : ""}.`); }
    else if (shot.kind === "follow") { const [a, b] = truckBlurb(shot.truck, tick); ct = a; cx = esc(b); }
    else { ct = `${HUB_NAME}, the agent's hub`; cx = "Its trucks between jobs."; }
  }
  put("capt", ct, "textContent"); put("capx", cx);
  const capIn = seg.kind === "plan" || seg.kind === "run" ? smooth((T - (seg.kind === "run" ? SHOTS[shotAt(T)].t0 : seg.t0)) / 0.35) : 0;
  $("cap").style.opacity = ct ? Math.max(capIn, seg.kind === "run" ? 1 : capIn) : 0;

  // feed
  const lines = FEED[turn] || [], shown = seg.kind === "plan" ? Math.ceil(lines.length * smooth((T - seg.t0) / ((seg.t1 - seg.t0) * 0.8))) : seg.kind === "intro" ? 0 : lines.length;
  const vis = lines.slice(0, shown).map((l, i) => ({ ...l, i })).slice(-8);
  put("feednote", seg.kind === "intro" ? "" : `turn ${turn + 1} · ${lines.length} calls`, "textContent");
  put("feedrows", vis.map(l => l.say ? `<div class="fl say"><span class="n">#${l.i + 1}</span><div><div class="fn">“${esc(firstSentences(l.fn, 120))}”</div></div></div>`
    : `<div class="fl${l.act ? " act" : ""}${l.err ? " err" : ""}"><span class="n">#${l.i + 1}</span><div><div class="fn">${esc(l.fn)}</div><div class="res">${esc(l.res)}</div></div></div>`).join(""));

  // fleet
  for (const t of MY_TRUCKS) {
    const d = frame.poses.find(p => p.t.id === t.id), L = d.L;
    const where = L.city ? CITY[L.city].name : `${route(edgeOf(L.a, L.b).route)} → ${CITY[L.b].name}`;
    const row = $("fr-" + t.id);
    const key = `${L.state}|${crewNames(L.crew)}|${where}`;
    if (cache["fr" + t.id] !== key) {
      cache["fr" + t.id] = key;
      row.children[0].style.background = STATE_RGB[L.state] || "#888";
      row.children[3].textContent = crewNames(L.crew) || "no driver";
      row.children[4].textContent = `${L.state === "stopped" && !L.city ? "stopped" : STATE_TXT[L.state] || L.state} · ${where}`;
    }
  }
  // books
  const [p, rev, cost] = booksAt(SEAT, tick), done = DELIVERED.filter(e => e.t <= tick);
  put("profit", money(p, true), "textContent"); $("profit").style.color = p >= 0 ? "var(--ok)" : "var(--red)";
  const count = st => frame.poses.filter(d => d.t.seat === SEAT && st.includes(d.L.state)).length;
  put("pnlrows", [["Revenue so far", money(rev)], ["Costs so far", money(cost)], ["Loads delivered", `${done.length}${done.some(e => e.late) ? ` · ${done.filter(e => e.late).length} late` : ""}`],
    ["On the road", `${count(["loaded", "empty"])} of ${MY_TRUCKS.length}`], ["Resting or at docks", count(["resting", "stopped", "detention"])], ["Broken down or held", count(["broken", "held"])]]
    .map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join(""));
  race(tick);
  // weather & roads
  const wx = frame.wx.filter(d => d.fade > 0.5), worst = wx.reduce((a, b) => (!a || b.sev > a.sev ? b : a), null);
  put("wxnote", `NOAA Storm Events · ${dateOf(Math.min(tick, WEEK - 1))}`, "textContent");
  put("wxbody", `<div class="big">${wx.length ? `${wx.length} road stretch${wx.length > 1 ? "es" : ""} under weather` : "Clear roads"}</div>`
    + `<div class="sub">${worst ? esc(`worst: ${worst.iv.type}, ${worst.iv.where} · trucks at ${Math.round(100 * (1 - worst.sev))}% speed`) : "no NOAA events on the board's roads now"}</div>`
    + frame.shut.slice(0, 3).map(c => `<div class="cl"><span class="tag">CLOSED</span><span>${esc(route(c.road))}</span><span class="when">reopens ~${clockOf(c.reopens_about)}</span></div>`).join("")
    + (frame.shut.length > 3 ? `<div class="cl"><span class="when" style="margin-left:0">+${frame.shut.length - 3} more closed</span></div>` : ""));
  $("tfill").style.width = tpos(T);
  overlays(T, seg);
}

const RACE_W = 606, RACE_H = 160, PAD = { l: 8, r: 150, t: 10, b: 18 };
const ALL_P = SEATS.flatMap(s => BOOKS[s].map(p => p[1])).concat(REFS ? [REFS.naive_usd, REFS.anchor_usd] : []);
const PMIN = Math.min(0, ...ALL_P), PMAX = Math.max(0, ...ALL_P);
const rx = tk => PAD.l + tk / WEEK * (RACE_W - PAD.l - PAD.r), ry = v => PAD.t + (1 - (v - PMIN) / ((PMAX - PMIN) || 1)) * (RACE_H - PAD.t - PAD.b);
function race(tick) {
  const key = Math.round(tick * 4); if (cache.race === key) return; cache.race = key;
  const parts = [`<line x1="${PAD.l}" x2="${RACE_W - PAD.r}" y1="${ry(0)}" y2="${ry(0)}" stroke="rgba(255,255,255,.18)"/>`];
  if (REFS) for (const [v, name] of [[REFS.anchor_usd, "optimizer"], [REFS.naive_usd, "simple dispatcher"]]) {
    parts.push(`<line x1="${PAD.l}" x2="${RACE_W - PAD.r}" y1="${ry(v)}" y2="${ry(v)}" stroke="rgba(255,255,255,.28)" stroke-dasharray="3 4"/>`,
               `<text x="${RACE_W - PAD.r + 8}" y="${ry(v) + 4}" font-size="11.5" fill="#7d8794">${name} ${money(v, true)}</text>`);
  }
  for (const s of SEATS) {
    const pts = BOOKS[s].filter(p => p[0] <= tick).map(p => [p[0], p[1]]); pts.push([tick, booksAt(s, tick)[0]]);
    const d = pts.map(([x, v], i) => `${i ? "L" : "M"}${rx(x).toFixed(1)},${ry(v).toFixed(1)}`).join("");
    const me = s === SEAT, [lx, lv] = pts[pts.length - 1];
    parts.push(`<path d="${d}" fill="none" stroke="${seatCss(s)}" stroke-width="${me ? 3 : 1.6}" stroke-linejoin="round" opacity="${me ? 1 : 0.75}"/>`,
               `<circle cx="${rx(lx)}" cy="${ry(lv)}" r="${me ? 4.5 : 3}" fill="${seatCss(s)}"/>`);
    if (me) parts.push(`<text x="${rx(lx) + 8}" y="${ry(lv) - 8}" font-size="13" font-weight="700" fill="${seatCss(s)}">${money(lv, true)}</text>`);
  }
  parts.push(`<text x="${PAD.l}" y="${RACE_H - 2}" font-size="11" fill="#66707c">Mon</text><text x="${RACE_W - PAD.r}" y="${RACE_H - 2}" font-size="11" fill="#66707c" text-anchor="end">Sun</text>`,
             ...SEATS.map((s, i) => `<text x="${PAD.l + 40 + i * 150}" y="${RACE_H - 2}" font-size="11.5" fill="${seatCss(s)}">● ${s}${s === SEAT ? ` · ${MODEL}` : " · optimizer"}</text>`));
  $("racesvg").innerHTML = parts.join("");
}

// intro and outro cards
const QUOTES = (() => {
  const notes = Object.values(TURN).filter(t => (t.notes || "").length > 40);
  const first = notes[0], last = notes[notes.length - 1];
  return [first, last && last !== first ? last : null].filter(Boolean).map(t => ({ text: firstSentences(t.notes, 260), when: clockOf(t.turn * TT) }));
})();
const nLate = DELIVERED.filter(e => e.late).length, usage = AGENT.usage || {};
$("intro").innerHTML = `<div class="k">TRUCKSIM · AGENT-DRIVEN WEEK</div><h1>${esc($("title").textContent)}</h1>
  <p>${esc(MODEL)} dispatches ${MY_TRUCKS.length} units out of ${esc(HUB_NAME)} for one real week of Texas Triangle freight, ${shortDate(0)}–${shortDate(6)}, ${R.week.monday.slice(0, 4)}, using only the tools a dispatcher has. Two rival companies, run by the optimizer, bid for the same loads.</p>
  <div class="facts"><div><b>${R.events.filter(e => e.kind === "offer_posted").length}</b>loads posted</div><div><b>${R.events.filter(e => e.kind === "weather_start").length}</b>NOAA weather events</div><div><b>${CLOSURES.length}</b>road closures</div><div><b>${NT}</b>turns of 6 hours</div></div>`;
const rulerPts = REFS ? [[REFS.naive_usd, 0.2, "simple dispatcher", "#9ba4b0", false], [REFS.anchor_usd, 1.0, "optimizer", "#c8cfd8", false], [R.seats[SEAT].profit_usd, SCORE, MODEL, seatCss(SEAT), true]] : [];
const rLo = Math.min(...rulerPts.map(p => p[0])), rHi = Math.max(...rulerPts.map(p => p[0]));
$("outro").innerHTML = `<div id="quotes"><div class="k">IN ITS OWN WORDS</div>${QUOTES.map(q => `<blockquote>“${esc(q.text)}”<cite>— ${esc(MODEL)}'s notes, ${q.when}</cite></blockquote>`).join("")}</div>
  <div id="result"><div class="k">RESULT</div><h1>Finished the week ${money(R.seats[SEAT].profit_usd, true)}.</h1>
  <div class="sub">${SCORE != null ? `Score ${SCORE.toFixed(2)}: 0.2 is the simple dispatcher's week in this seat, 1.0 the optimizer's.` : ""}</div>
  ${REFS ? `<div class="ruler"><div class="ln"></div>${rulerPts.map(([v, sc, name, col, me]) => `<div class="pt" style="left:${((v - rLo) / ((rHi - rLo) || 1) * 90 + 5).toFixed(1)}%"><i style="background:${col}"></i><div class="lb ${me ? "above" : "below"}"><b${me ? ` style="color:${col}"` : ""}>${esc(name)} · ${me ? sc.toFixed(2) : sc.toFixed(1)}</b><span>${money(v, true)}</span></div></div>`).join("")}</div>` : ""}
  <table><tr><td>Delivered</td><td>${DELIVERED.length} loads${nLate ? `, ${nLate} late` : ""}</td></tr>
  <tr><td>Tool calls</td><td>${(usage.tool_calls || 0).toLocaleString()} over ${NT} turns</td></tr>
  <tr><td>Tokens</td><td>${((usage.input_tokens || 0) / 1e6).toFixed(1)}M in · ${Math.round((usage.output_tokens || 0) / 1000)}k out</td></tr>
  <tr><td>Rivals</td><td>${SEATS.filter(s => s !== SEAT).map(s => `${s} (${esc(CITY[R.seats[s].hub].name)}) ${money(R.seats[s].profit_usd, true)}`).join(" · ")}</td></tr></table></div>`;
function overlays(T, seg) {
  const it = seg.kind === "intro" ? (1 - smooth((T - (INTRO - 1.6)) / 1.4)) * smooth(T / 0.6) : 0;
  $("intro").style.opacity = it; $("intro").style.display = it > 0.01 ? "flex" : "none";
  const u = seg.kind === "outro" ? T - seg.t0 : -1, ot = u < 0 ? 0 : smooth(u / 0.8);
  $("outro").style.opacity = ot; $("outro").style.display = ot > 0.01 ? "flex" : "none";
  if (ot > 0.01) {
    const q = 1 - smooth((u - 7) / 0.6), r = smooth((u - 7.4) / 0.8);
    $("quotes").style.opacity = q; $("quotes").style.display = q > 0.01 ? "" : "none";
    $("result").style.opacity = r; $("result").style.display = r > 0.01 ? "" : "none";
  }
  for (const id of ["tl", "cap", "fleet", "feed", "pnl", "race", "wxp"]) $(id).style.visibility = it > 0.6 || ot > 0.6 ? "hidden" : "visible";
}

// labels on the map: money as loads deliver, the agent's trucks' moments, closed roads
const POPS = [];
for (const e of R.events) {
  if (e.kind === "delivered") POPS.push({ e, t: e.t, truck: e.truck, mine: e.seat === SEAT, cls: "money", color: seatCss(e.seat), text: `+${money(e.revenue_usd)}${e.late ? ` · ${e.late_h ? e.late_h.toFixed(1) + " h " : ""}late` : ""}` });
  else if (e.seat === SEAT && e.kind === "missed_pickup") POPS.push({ e, t: e.t, truck: truckOfLoad(e.load, e.t), mine: true, cls: "money", color: "var(--red)", text: `missed pickup ${money(-e.penalty)}` });
  else if (e.seat === SEAT && e.kind === "released") POPS.push({ e, t: e.t, truck: truckOfLoad(e.load, e.t), mine: true, cls: "money", color: "var(--red)", text: `released ${money(-e.penalty)}` });
  else if (e.seat === SEAT && KEY[e.kind] && e.truck) POPS.push({ e, t: e.t, truck: e.truck, mine: true, cls: "ev", text: { breakdown: "⚠ breakdown", held: "⛔ held", turned_back: "↶ turns back", detour: "↷ detour", adverse_conditions: "+2 h, bad weather", crew_change: "⇄ fresh crew", declined: "✕ declined" }[e.kind] || e.kind });
}
const labelEls = new Map();
function placeLabel(key, cls, html, xy, alpha, color) {
  let el = labelEls.get(key);
  if (!el) { el = document.createElement("div"); el.className = "lab " + cls; $("labels").appendChild(el); labelEls.set(key, el); }
  if (el._html !== html) { el.innerHTML = html; el._html = html; }
  el.style.left = xy[0] + "px"; el.style.top = xy[1] + "px"; el.style.opacity = alpha; if (color) el.style.color = color;
  el._seen = true;
}
function labels(T, tick, S, frame, zoom) {
  for (const el of labelEls.values()) el._seen = false;
  const W = innerWidth, H = innerHeight, boxes = ["tl", "cap", "fleet", "feed", "pnl", "race", "wxp"].map(id => $(id).getBoundingClientRect());
  const onScreen = xy => xy.x > 20 && xy.x < W - 20 && xy.y > 20 && xy.y < H - 20 && !boxes.some(b => xy.x > b.left - 30 && xy.x < b.right + 30 && xy.y > b.top - 10 && xy.y < b.bottom + 40);
  for (const p of POPS) {
    if (!p.truck || (!p.mine && zoom < 8.2)) continue;
    const age = T - timeOfTick(p.t); if (age < 0 || age > 2.6) continue;
    const at = pose(p.truck, p.t, S).p, xy = map.project(at); if (!onScreen(xy)) continue;
    placeLabel(`pop${R.events.indexOf(p.e)}`, p.cls, esc(p.text), [xy.x, xy.y - 26 - 30 * smooth(age / 2.6)], smooth(age / 0.2) * (1 - smooth((age - 2) / 0.6)), p.color);
  }
  if (zoom > 7.2) for (const c of frame.shut) { const xy = map.project(c.mid); if (onScreen(xy)) placeLabel("cl" + c.closure_id, "closed", `${esc(c.label)} CLOSED`, [xy.x, xy.y - 14], 1); }
  for (const [k, el] of labelEls) if (!el._seen) { el.remove(); labelEls.delete(k); }
}

// ---- drawing a moment ---------------------------------------------------------------------------------------------
let director = true, lastFrame = null;
function draw(T) {
  T = clamp(T, 0, DURATION);
  const tick = tickAt(T);
  if (director) map.jumpTo(camera(T));
  const zoom = map.getZoom(), S = unitMeters(zoom, map.getCenter().lat);
  setSky(dayness(tick));
  const frame = layers(T, tick, S, zoom);
  overlay.setProps({ layers: frame.layers });
  hud(T, tick, frame);
  labels(T, tick, S, frame, zoom);
  lastFrame = { T, tick };
}
const idle = () => new Promise(res => { map.once("idle", res); map.triggerRepaint(); });
async function modelsLoaded() {   // the GLBs load asynchronously: a recording must not start before they draw
  const t0 = performance.now();
  for (;;) {
    const ls = (overlay._deck && overlay._deck.layerManager) ? overlay._deck.layerManager.getLayers() : [];
    const scene = ls.filter(l => l.id.startsWith("trucks-"));
    if (scene.length === MODEL_KEYS.length && scene.every(l => l.state && l.state.scenegraph)) return;
    if (performance.now() - t0 > 30000) throw new Error("the truck models did not load in 30 s");
    draw(Number(Q.get("t") || 0)); await new Promise(r => setTimeout(r, 100));
  }
}
draw(Number(Q.get("t") || 0));
await modelsLoaded();
await document.fonts.ready;
await idle();
window.cinema = { duration: DURATION, run: RUN_ID, ready: true, segments: SEG.map(s => ({ kind: s.kind, t0: s.t0, t1: s.t1, turn: s.turn })),
                  async seek(T) { draw(T); await idle(); return lastFrame; }, _map: map, _overlay: overlay };   // the last two for debugging

if (!RECORD) {   // the interactive player
  $("controls").hidden = false;
  $("runpick").innerHTML = RUNS.filter(r => r.model).map(r => `<option value="${esc(r.id)}"${r.id === RUN_ID ? " selected" : ""}>${esc(r.task)} · ${esc(r.model.replace(/^anthropic\//, ""))}</option>`).join("");
  $("runpick").onchange = e => { location.search = `?run=${encodeURIComponent(e.target.value)}`; };
  let T = Number(Q.get("t") || 0), playing = !Q.has("paused"), speed = 1, last = performance.now();
  const setPlay = p => { playing = p; $("play").textContent = p ? "❚❚" : "▶"; };
  setPlay(playing);
  $("play").onclick = () => setPlay(!playing);
  $("speed").onchange = e => { speed = Number(e.target.value); };
  $("cammode").onchange = e => { director = e.target.value === "director"; };
  $("seek").oninput = e => { T = e.target.value / 1000 * DURATION; draw(T); };
  addEventListener("keydown", e => { if (e.code === "Space") { setPlay(!playing); e.preventDefault(); } if (e.code === "ArrowRight") T += 5; if (e.code === "ArrowLeft") T -= 5; });
  const loop = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) { T = Math.min(DURATION, T + dt * speed); if (T >= DURATION) setPlay(false); }
    draw(T); $("seek").value = Math.round(T / DURATION * 1000);
    $("tlabel").textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, "0")} / ${Math.floor(DURATION / 60)}:${String(Math.floor(DURATION % 60)).padStart(2, "0")}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
